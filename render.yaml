services:
  - type: web
    name: socom-141-webrtc-signaling
    runtime: node
    plan: free
    region: virginia
    rootDir: deploy/signaling
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: SOCOM_WEBRTC_MAX_TOURNAMENT_PEERS
        value: 32
